<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 Success</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0fdf4;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 0.5px solid #d1fae5;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #5DCAA5, #378ADD, #7F77DD);
        }

        .check-wrap {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: #f0fdf4;
            border: 1.5px solid #9FE1CB;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        .check-wrap i { font-size: 32px; color: #1D9E75; }

        @keyframes popIn {
            from { transform: scale(0.4); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        h1 {
            font-size: 20px; font-weight: 500;
            color: #0F6E56; margin: 0 0 6px;
            animation: fadeUp 0.4s ease 0.2s both;
        }

        p {
            font-size: 13px; color: #6b7280;
            margin: 0 0 28px; line-height: 1.6;
            animation: fadeUp 0.4s ease 0.3s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .pills {
            display: flex; gap: 8px;
            justify-content: center; flex-wrap: wrap;
            animation: fadeUp 0.4s ease 0.4s both;
        }

        .pill {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; padding: 4px 10px;
            border-radius: 99px;
            border: 0.5px solid #9FE1CB;
            color: #0F6E56; background: #f0fdf4;
        }

        .pill i { font-size: 12px; }

        .hint {
            margin-top: 24px;
            font-size: 11px; color: #9ca3af;
            animation: fadeUp 0.4s ease 0.5s both;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="check-wrap">
        <i class="ti ti-check"></i>
    </div>
    <h1>Successfully logged in</h1>
    <p>Your Google account has been connected.<br>You can close this window now.</p>
    <div class="pills">
        <div class="pill"><i class="ti ti-shield-check"></i> Secure session</div>
        <div class="pill"><i class="ti ti-lock"></i> OAuth2</div>
        <div class="pill"><i class="ti ti-user-check"></i> Verified</div>
    </div>
    <p class="hint">This window will close automatically</p>
</div>
</body>
</html>
