<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fef2f2;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 0.5px solid #fecaca;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #F09595, #E24B4A, #D85A30);
        }

        .icon-wrap {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: #fef2f2;
            border: 1.5px solid #F7C1C1;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        .icon-wrap i { font-size: 30px; color: #E24B4A; }

        @keyframes popIn {
            from { transform: scale(0.4); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        h1 {
            font-size: 20px; font-weight: 500;
            color: #A32D2D; margin: 0 0 6px;
            animation: fadeUp 0.4s ease 0.2s both;
        }

        p {
            font-size: 13px; color: #6b7280;
            margin: 0 0 28px; line-height: 1.6;
            animation: fadeUp 0.4s ease 0.3s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .pills {
            display: flex; gap: 8px;
            justify-content: center; flex-wrap: wrap;
            animation: fadeUp 0.4s ease 0.4s both;
        }

        .pill {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; padding: 4px 10px;
            border-radius: 99px;
            border: 0.5px solid #F7C1C1;
            color: #A32D2D; background: #fef2f2;
        }

        .pill i { font-size: 12px; }

        .hint {
            margin-top: 24px;
            font-size: 11px; color: #9ca3af;
            animation: fadeUp 0.4s ease 0.5s both;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap">
        <i class="ti ti-shield-x"></i>
    </div>
    <h1>Authorization failed</h1>
    <p>{{ .message }}</p>
    <div class="pills">
        <div class="pill"><i class="ti ti-alert-triangle"></i> Session expired</div>
        <div class="pill"><i class="ti ti-x"></i> Access denied</div>
        <div class="pill"><i class="ti ti-refresh"></i> Try again</div>
    </div>
    <p class="hint">Close this window and retry from the extension</p>
</div>
</body>
</html>
